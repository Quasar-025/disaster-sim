[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-sim"
version = "0.1.0"
description = "Autonomous Multi-Agent Disaster Response System using Reinforcement Learning + Digital Twin"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pygame>=2.5",
    "matplotlib>=3.8",
    "Pillow>=10.0",
]

[project.optional-dependencies]
rl = [
    "torch>=2.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.1",
    "pettingzoo>=1.24",
    "tensorboard>=2.15",
]
cv = [
    "opencv-python>=4.8",
    "ultralytics>=8.0",
    "albumentations>=1.3",
]
routing = [
    "ortools>=9.7",
    "networkx>=3.1",
]
backend = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "websockets>=12.0",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
all = ["disaster-sim[rl,cv,routing,backend,dev]"]

[tool.setuptools.packages.find]
include = ["disaster_sim*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
